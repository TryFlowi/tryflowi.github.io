<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flowi Viagens - Disney (Free)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f5f7; color: #1e293b; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    h1 { font-size: 20px; margin-bottom: 15px; text-align: center; color: #0f172a; }
    .nav { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; }
    .nav button { flex: 1; padding: 10px; border: none; background: none; font-weight: 600; color: #64748b; cursor: pointer; }
    .nav button.active { color: #2563eb; border-bottom: 2px solid #2563eb; margin-bottom: -2px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .field-row { display: flex; gap: 10px; margin-bottom: 15px; }
    .field { flex: 1; }
    label { display: block; font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 5px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
    button.btn-add { width: 100%; padding: 12px; background: #0f172a; color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 10px; }
    .list-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-bottom: 1px solid #e2e8f0; }
    .list-item.done span { text-decoration: line-through; color: #94a3b8; }
    .item-actions { display: flex; gap: 8px; }
    .btn-icon { background: none; border: none; cursor: pointer; font-size: 14px; color: #64748b; }
    .cd-box { display: flex; justify-content: space-around; background: #0f172a; color: #fff; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
    .cd-num { font-size: 20px; font-weight: bold; }
    .cd-lbl { font-size: 10px; text-transform: uppercase; color: #94a3b8; }
  </style>
</head>
<body>

<div class="container">
  <h1>flowi <span style="font-size: 12px; color: #64748b;">DISNEY FREE</span></h1>

  <div class="cd-box">
    <div><div class="cd-num" id="cd-dias">--</div><div class="cd-lbl">Dias</div></div>
    <div><div class="cd-num" id="cd-hrs">--</div><div class="cd-lbl">Horas</div></div>
    <div><div class="cd-num" id="cd-min">--</div><div class="cd-lbl">Min</div></div>
  </div>

  <div class="nav">
    <button class="tab-btn active" onclick="switchTab('inicio')">Início</button>
    <button class="tab-btn" onclick="switchTab('docs')">Documentos</button>
    <button class="tab-btn" onclick="switchTab('orcamento')">Orçamento</button>
    <button class="tab-btn" style="color: #2563eb;" onclick="location.href='premium.html'">★ Premium</button>
  </div>

  <!-- ABA INÍCIO -->
  <div id="tab-inicio" class="tab-content active">
    <div class="field"><label>Nome da viagem</label><input type="text" id="cfg-nome" oninput="salvar()"></div>
    <div class="field-row" style="margin-top: 10px;">
      <div class="field"><label>Data de ida</label><input type="date" id="cfg-ida" oninput="salvar()" onchange="salvar()"></div>
      <div class="field"><label>Data de volta</label><input type="date" id="cfg-volta" oninput="salvar()" onchange="salvar()"></div>
    </div>
  </div>

  <!-- ABA DOCUMENTOS -->
  <div id="tab-docs" class="tab-content">
    <label>Documento ou tarefa</label>
    <input type="text" id="doc-input" placeholder="Ex: Renovando Passaporte">
    <button class="btn-add" onclick="addDoc()">Adicionar</button>
    <div id="docs-list" style="margin-top: 15px;"></div>
  </div>

  <!-- ABA ORÇAMENTO -->
  <div id="tab-orcamento" class="tab-content">
    <label>Descrição da Despesa</label>
    <input type="text" id="orc-desc" placeholder="Ex: Passagens Aéreas" style="margin-bottom: 10px;">
    <div class="field-row">
      <div class="field"><label>Categoria</label>
        <select id="orc-cat">
          <option value="Passagens">Passagens</option>
          <option value="Hospedagem">Hospedagem</option>
          <option value="Ingressos">Ingressos</option>
          <option value="Outros">Outros</option>
        </select>
      </div>
      <div class="field"><label>Valor Estimado (R$)</label><input type="number" id="orc-val" placeholder="0"></div>
    </div>
    <button class="btn-add" onclick="addOrc()">Adicionar Item</button>
    <div id="orc-list" style="margin-top: 15px;"></div>
  </div>
</div>

<script>
let estado = {
  config: {},
  check: [
    { id: 'c1', nome: 'Passaporte válido por 6+ meses', cat: 'Documentação', done: false },
    { id: 'c2', nome: 'Visto americano (B1/B2) aprovado', cat: 'Documentação', done: false },
    { id: 'c3', nome: 'Passagens aéreas compradas', cat: 'Reservas', done: false },
    { id: 'c4', nome: 'Hotel ou resort reservado', cat: 'Hospedagem', done: false },
    { id: 'c5', nome: 'Ingressos Disney comprados', cat: 'Ingressos', done: false }
  ],
  orc: []
};

function set(id, v) { var e = document.getElementById(id); if(e) e.textContent = v; }
function get(id) { return (document.getElementById(id) || {}).value || ''; }

function carregar() {
  try {
    var s = localStorage.getItem('flowi-disney-data');
    if (s) estado = JSON.parse(s);
  } catch(e){}

  var c = estado.config || {};
  if(document.getElementById('cfg-nome')) document.getElementById('cfg-nome').value = c.nome || '';
  if(document.getElementById('cfg-ida')) document.getElementById('cfg-ida').value = c.ida || '';
  if(document.getElementById('cfg-volta')) document.getElementById('cfg-volta').value = c.volta || '';

  renderDocs();
  renderOrc();
  countdown();
}

function salvar() {
  estado.config = {
    nome: get('cfg-nome'),
    ida: get('cfg-ida'),
    volta: get('cfg-volta')
  };
  localStorage.setItem('flowi-disney-data', JSON.stringify(estado));
  countdown();
}

function switchTab(tab) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  event.target.classList.add('active');
}

function renderDocs() {
  var list = document.getElementById('docs-list');
  if(!list) return;
  var html = '';
  (estado.check || []).forEach((item, index) => {
    html += `
      <div class="list-item ${item.done ? 'done' : ''}">
        <span onclick="toggleDoc(${index})" style="cursor:pointer;">${item.done ? '✓ ' : '◯ '} ${item.nome}</span>
        <div class="item-actions">
          <button class="btn-icon" onclick="removerDoc(${index})">✕</button>
        </div>
      </div>`;
  });
  list.innerHTML = html;
}

function addDoc() {
  var v = get('doc-input');
  if(!v) return;
  if(!estado.check) estado.check = [];
  estado.check.push({ id: 'c_' + Date.now(), nome: v, cat: 'Documentação', done: false });
  document.getElementById('doc-input').value = '';
  localStorage.setItem('flowi-disney-data', JSON.stringify(estado));
  renderDocs();
}

function toggleDoc(i) {
  estado.check[i].done = !estado.check[i].done;
  localStorage.setItem('flowi-disney-data', JSON.stringify(estado));
  renderDocs();
}

function removerDoc(i) {
  estado.check.splice(i, 1);
  localStorage.setItem('flowi-disney-data', JSON.stringify(estado));
  renderDocs();
}

function renderOrc() {
  var list = document.getElementById('orc-list');
  if(!list) return;
  var html = '';
  (estado.orc || []).forEach((item, index) => {
    html += `
      <div class="list-item">
        <div><strong>${item.nome}</strong> <small>(${item.cat})</small></div>
        <div>R$ ${(parseFloat(item.est) || 0).toFixed(2)} <button class="btn-icon" onclick="removerOrc(${index})">✕</button></div>
      </div>`;
  });
  list.innerHTML = html;
}

function addOrc() {
  var desc = get('orc-desc');
  var cat = get('orc-cat');
  var val = parseFloat(get('orc-val')) || 0;
  if(!desc) return;
  if(!estado.orc) estado.orc = [];
  estado.orc.push({ id: 'o_' + Date.now(), nome: desc, cat: cat, est: val, pago: 0, status: 'Pendente' });
  document.getElementById('orc-desc').value = '';
  document.getElementById('orc-val').value = '';
  localStorage.setItem('flowi-disney-data', JSON.stringify(estado));
  renderOrc();
}

function removerOrc(i) {
  estado.orc.splice(i, 1);
  localStorage.setItem('flowi-disney-data', JSON.stringify(estado));
  renderOrc();
}

function countdown(){
  var c = estado.config || {};
  if(!c.ida){
    ['cd-dias','cd-hrs','cd-min'].forEach(id => set(id, '--'));
    return;
  }
  var partes = c.ida.split('-');
  var ida = new Date(partes[0], partes[1] - 1, partes[2], 0, 0, 0);
  var agora = new Date();
  var diff = ida - agora;

  if(diff <= 0){
    ['cd-dias','cd-hrs','cd-min'].forEach(id => set(id, '0'));
    return;
  }

  set('cd-dias', Math.floor(diff / (1000 * 60 * 60 * 24)));
  set('cd-hrs', Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)));
  set('cd-min', Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)));
}

document.addEventListener('DOMContentLoaded', carregar);
</script>
</body>
</html>
